      GitHub Pages serves static files only, so it cannot issue a server-side
      301. This page redirects client-side: location.replace() fires first (it
      does not leave an entry in the back-button history), with a meta refresh
      as the fallback when JavaScript is unavailable, and a manual link if
      both are blocked.
    -->

        }
    </style>
</head>
